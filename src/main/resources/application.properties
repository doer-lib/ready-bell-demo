quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.access-control-max-age=1H
quarkus.http.cors.access-control-allow-credentials=true

# demo.ready-bell.com is served via AWS API Gateway, which rewrites Host to
# home.bin932.com:3160 and injects "Forwarded: host=demo.ready-bell.com;proto=https"
# so absolute URIs (e.g. the Location header) point at the public hostname.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=true

# quarkus.http.port/ssl-port aren't set here — the web-service systemd
# unit on bin932-home renders them straight into an external
# config/application.properties (ansible/roles/web-service), since one
# Pi hosts several of these services on different ports.

ready-bell-demo.bucket=ready-bell-demo
quarkus.s3.aws.region=eu-central-1
quarkus.s3.devservices.enabled=false

quarkus.flyway.migrate-at-start=true

quarkus.log.category."readybell".level=DEBUG
