name: PR Command Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head branch
        id: pr-ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName,headRefOid \
            --jq '"branch=\(.headRefName)\nsha=\(.headRefOid)"' >> "$GITHUB_OUTPUT"

      - name: Slash Command Dispatch
        uses: peter-evans/slash-command-dispatch@v5
        with:
          token: ${{ secrets.PR_COMMANDS_PAT }}
          permission: write
          issue-type: pull-request
          config: >
            [
              {
                "command": "retest",
                "dispatch_type": "workflow",
                "static_args": [
                  "ref=${{ steps.pr-ref.outputs.branch }}",
                  "comment_id=${{ github.event.comment.id }}",
                  "sha=${{ steps.pr-ref.outputs.sha }}"
                ]
              },
              {
                "command": "deploy",
                "dispatch_type": "workflow",
                "static_args": [
                  "ref=${{ steps.pr-ref.outputs.branch }}",
                  "comment_id=${{ github.event.comment.id }}",
                  "sha=${{ steps.pr-ref.outputs.sha }}"
                ]
              }
            ]
